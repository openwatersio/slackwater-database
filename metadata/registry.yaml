  aliases: [big bras d'or, bras d'or lakes, boularderie, seal island bridge]
  source: >-
    The sea entrance to the Bras d'Or Lakes; the rapid is at the outer narrows
    between Carey Point and Noir Point, not at the Seal Island Bridge 4.7 miles
    southwest. Sailing Directions ATL 104 refers the mariner to the current
    tables for slack water here. CHS names the same station both "Big Bras
    D'Or" and "Great Bras D'or"; the channel is Great Bras d'Or, so that is the
    name, with the other carried as an alias. Position from CHS's public
    current-station list, matched by position and confirmed in the channel -
    the tide reference ports' method, see PROVENANCE.md. Note for a consumer:
    slack here lags high and low water by hours - a 3.5 to 4 h median across
    the 2026 predictions, ranging 2.5 to 5.5 - and the stream direction is
    inverted relative to the sea tide, flowing out while the tide rises. Slack
    must never be derived from tide height; read the current table.

