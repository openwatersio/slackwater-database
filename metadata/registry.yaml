# Stations whose identity this package owns, rather than corrects.
#
# Unlike corrections.yaml, these records have no upstream to differ from: the
# name is not a provider's name and the position is not a correction of a
# published one. CHS tidal-current gates are the first data like this - the
# fitting pipeline emits a hand-written label and no position at all.
#
# Two bounded, hand-curated classes, told apart by `kind`:
#   - current gates (`kind: current`, or omitted - the registry was gates-only
#     first). A current station joins when safe transit requires timing slack:
#     the gates on the Inside Passage route, not every interesting current.
#   - tide reference ports (`kind: tide`). A tide station joins when CHS itself
#     designates it a reference port - an external rule we did not invent.
# Both rules are expansion-friendly and rule-governed; neither is a cap. A
# consumer picks the right CHS series (currents vs tides) by a station's kind.
#
# --- The rest of Canada, and why it is six stations shorter than you expect ---
# CHS publishes tidal currents at exactly 30 stations nationally. Twenty are
# here. The gate rule above rejects the other ten less two: what follows is that
# survey, written down so the next person does not re-run it and so nobody
# "discovers" a missing station and adds it back without the reason.
#
#   ADMITTED  Nakwakto Rapids, Quatsino Narrows, Masset Sound, Great Bras d'Or.
#             Each one has a published instruction to transit on slack.
#
#   REJECTED - a current station exists, but nothing times a transit on it:
#     Scott Channel        Sailing Directions: "deep and free of dangers". Tide
#                          rips on a headland rounding, not a gate. Cruisers
#                          round Cape Scott on Nahwitti Bar's slack instead.
#     Hiekish Narrows      No slack caution in PAC 205, and it is the optional
#                          east branch - Tolmie Channel is the Inner Passage
#                          route. VTS only asks you to advise if transiting.
#     Grand Manan Channel  ATL 106: "no dangers in the fairway". Also
#                          discontinued as a station. Head Harbour Passage
#                          nearby DOES run to 5 kn - but CHS predicts no
#                          current there, so there is nothing to admit.
#     Abegweit Passage     2.0 kn under the Confederation Bridge, across 5.5
#                          miles of navigable width. ATL 108 gives no stream
#                          rate and no slack advice at all. The widely-copied
#                          "4 knots" is Wikipedia, roughly double CHS.
#     Fairview Terminal    A container berth on Kaien Island. A temporary
#                          station feeding Prince Rupert's pilotage
#                          instrumentation - berthing data, not a passage.
#     Porpoise Channel     The near miss, and the one worth reading before
#       East               re-adding it. There IS a published HW-slack rule for
#                          Porpoise Harbour, and Pub 154 does say 6-7 kn - but
#                          that is an under-keel-clearance window for loaded
#                          ships at the Ridley-Lelu narrows, and THIS station
#                          sits east of that pinch, where CHS predicts 2.0 kn.
#                          A gate whose station is not on the gate is worse
#                          than no gate.
#
# Whether an admitted gate's slack can be PREDICTED is a separate question,
# asked downstream and answered against published events - Nakwakto is a real
# gate that no harmonic model fits (see openwatersio/slackwater-ios#9).
#
# A current gate may additionally carry a `derived` block when CHS publishes no
# current station for it and slack is derived from a reference tide port's
# high/low water (see the "Derived gates" section below). It stays kind:current
# - it is still a gate - but a consumer reads its slack from the reference, not
# from a fitted current series.
#
# A fitted current gate (one with its own CHS current predictions) may instead
# carry a `tideReference`: the registry key of the tide reference port whose
# water a paired tide+current view shows beside it. Sourcing rule, applied to
# every pair below and verifiable from the positions in this file: the
# `tideReference` is the *nearest* of the tide reference ports (kind: tide) in
# the same tidal regime - chosen by position, not guessed. The two a mariner
# would double-check both match standard published secondary-reference practice:
# Seymour Narrows -> Campbell River, and Sechelt Rapids (Skookumchuck) -> Point
# Atkinson (Ports and Passes / Waggoner). A gate with no honestly-near reference
# port carries none: unpaired beats a wrong pairing. Distinct from and mutually
# exclusive with `derived` - tideReference is a display companion, derived is
# where slack comes from - and only an ordinary current gate carries either.
#
# Keys match what chs-constituents emits ("chs-" + slug of the label), so a
# consumer can resolve straight from the id in its own output.
#
# These are our own facts, not a copy of a provider's station file. Names and
# contexts are hand-written here; positions are independently derived from the
# chs-constituents fitting pipeline and currents-vault pass frontmatter, and
# agree with chs-constituents/stations/salish-sea.json. The registry ships no
# provider-minted identifiers - that id lives only in each operator's local,
# licence-covered pipeline (see PROVENANCE.md). Every station is
# human-reviewed before it lands. That default provenance is documented once
# in PROVENANCE.md; set a station's `source` field only when its facts came
# from somewhere else (see noaa-boundary-pass).
#
# A slug, once published, belongs to its station for good. When a station's
# slug moves, `npm run metadata:lock` records the old one in
# `metadata/former-slugs.json` so consumers redirect it, and the allocator
# treats every retired slug as taken so it can never name other water. A
# deliberate migration re-ladders chosen ids with `npm run metadata:lock --
# ids.json`; resetting the lock is never the way, because it forgets every
# published address at once.
#
# `formerSlugs` is for a redirect the table cannot know about: a slug this
# station answered to before the lock existed, or under a retired id. Record
# one only when the old slug named the *same place* - a rename qualifies, a
# mislabel does not, since redirecting a mislabel preserves a wrong link where
# a 404 is more honest (issue #6, the retired `anacortes`).
#
# Two ids for one station share a slug: a curated record beside the provider's
# own row for the same water. Point the provider row at the curated slug with
# `slug:` in corrections.yaml; the lock allows the pair and refuses a second
# registry owner or a share between two provider rows.
#
# One entry is not CHS: noaa-boundary-pass is a NOAA current station, carried
# here because currents-vault (which curates the same 20 gates) is dropping
# station identity in favour of this registry.

