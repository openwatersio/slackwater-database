# Corrections to published station data. One record per station, keyed by
# provider ID. Every field is optional except `reason`, which is required
# whenever `position` is set.
#
# `context` is whatever most usefully distinguishes this place — a water body,
# an island group, a region, a county, or a characteristic. It must never
# restate the name. Without one, a station takes the qualifier in its provider
# name, then the OpenStreetMap bay or strait it sits in, then the nearest
# place. Curate `context` only where that answer is wrong or less useful.
#
# `formerSlugs` records a slug this station used to resolve to, so a consumer
# can redirect an old shared link instead of 404ing it. Set it in the same
# change that moves `slug` - `npm run metadata:lock` refuses to retire a
# published path unless the old slug is recorded here.
# It is also what lets two ids for one station share a slug: see "Two ids may
# share one slug" in CONTRIBUTING.md.
#
# Only record a former slug when the new slug points at the *same place*: a
# rename qualifies, a mislabel does not - redirecting a mislabel preserves a
# wrong link, where a 404 is more honest (issue #6, the retired `anacortes`).
# No validator can make that call. Slug changes are rare; downstream consumers
# own the redirect consequences either way.

noaa/9447659:
  name: Everett
  slug: everett
  cities: [Everett, Marysville]
  aliases: [port gardner, everett marina]

