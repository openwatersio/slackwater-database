# noaa/9449988 - a NOAA short-term gauge removed 2016-01-31. Coordinate
# (48.443, -122.805) sits in Rosario Strait, not Puget Sound as the raw name
# claims; NOAA chart 18429 is "Rosario Strait, southern part". Name override
# strips the wrong qualifier. No `cities`: it sits mid-strait, ~5 km south of
# the bay on Decatur Island it is named for, so naming a nearest town would
# reintroduce the "which side?" ambiguity.
noaa/9449988:
  name: Telegraph Bay

# Two lighted buoys 4.4 m apart in the St Johns River, genuinely distinct -
# different flood and ebb directions, different M2 amplitudes. NOAA files their
# buoy numbers inconsistently: LB 20 carries its number in the *name*, LB 22
# carries "LB 22" in the region and is named bare "Mile Point". The ladder reads
# the name, so LB 20 was allocated `mile-point-lb-20` while LB 22 took the
# generic `mile-point` - one buoy identified, its sibling reading as the
# canonical station for the place when neither is.
#
# Both now carry their buoy number. `mile-point` belongs to neither and is
# retained here so no future station can be handed it.
noaa/jx0303:
  name: Mile Point LB 22
  context: St Johns River
  slug: mile-point-lb-22
  formerSlugs: [mile-point]

