ticon/massacre_bay_ak-550a-usa-uhslc_rq:
  sameGauge: noaa/9460150
  reason: PSMSL 491 identifies the 1943-1966 Massacre Bay record as NOAA/NOS data from UHSLC 550 (https://psmsl.org/data/obtaining/stations/491.php). UHSLC 550A describes the historic NOAA-operated Attu gauge (https://uhslc.soest.hawaii.edu/rqds/metadata_yaml/550Ameta.yaml); NOAA 9460150 identifies Massacre Bay at Attu, established in 1943 (https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/9460150.json?expand=details).

