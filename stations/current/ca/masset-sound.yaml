# The long sound on north Graham Island joining Masset Inlet to Dixon Entrance, pinching to under two cables at Cook Point, which Sailing Directions says should be navigated at or near slack water - slack lasting only a few minutes. The 2026 predictions peak at 5.8 knots ebbing and 5.6 flooding, with a median peak nearer 3.8 either way. Named for the sound, as the Sailing Directions and tide tables name it; CHS's station file says "Masset Channel", carried as an alias. Cited to PAC 206 when this entry was written; that volume is superseded by PAC 203, which carries the same wording. Position from CHS's public current-station list, matched by position and confirmed in the sound - the tide reference ports' method, see stations/README.md#provenance.

