# Must match `source.name` on every record this source writes, including the
# current stations from sources/noaa-current.
name: US National Oceanic and Atmospheric Administration
# A national hydrographic office: its records win duplicates against relays.
authoritative: true
# The waters whose gauges NOAA operates, as ISO alpha-2 codes. NOAA also
# publishes subordinate stations abroad from legacy foreign tide tables,
# predicted from a US reference often 1,000 km or more away; outside these
# waters its subordinates do not win a duplicate on authority.
jurisdiction:
  - US
  - PR
  - VI
  - GU
  - MP
  - AS
# Public domain: credit is welcome, so not imposed on consumers.
credit: null
# NOAA analyzes and predicts with Schureman's nodal corrections (Schureman 1958;
# Parker 2007, Tidal Analysis and Prediction, NOAA Special Publication NOS
# CO-OPS 3). Its current stations' constants come from the same programs
# (Zervas 1999, NOAA Technical Memorandum NOS CO-OPS 0021).
node_corrections: schureman
# NOAA's own lines where they differ from @slackwater/engine's catalog.
constituent_definitions:
  # NOAA corrects SIGMA1 with O1's nodal factor and phase applied twice. The
  # catalog's sigma1, which JMA, DMI, Kartverket, LINZ and TICON share, takes
  # O1's once. At Anchorage (9455920), the only NOAA station that publishes
  # it, a fit applying O1's once lands 7 mm and 4.7° from NOAA's constant;
  # applying it twice agrees to 0.2 mm (#428). Its argument is exactly 2O1 - P1,
  # and P1 takes no nodal correction, so NOAA likely treats it as that compound;
  # no NOAA document says so.
  - name: SIGMA1
    speed: 12.9271398
    coefficients: [1, -3, 2, 0, 0, 0, 1]
    members:
      - [O1, 2]
