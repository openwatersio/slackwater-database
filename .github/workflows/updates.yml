name: Update Stations

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC
    - cron: "0 2 1 * *"
  workflow_dispatch: # Allow manual triggering
    inputs:
      retire:
        description: Allow more than ten records to retire in this run, once the import is checked
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  noaa:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run NOAA stations update
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # An explicit `bash` runs with pipefail, so a crashed import fails the
        # job instead of `tee`'s exit status letting a partial refresh through.
        shell: bash
        run: |
          npm run -s import -w sources/noaa 2>&1 | tee /tmp/noaa-update.log
          # Extract the markdown summary (everything after "## Summary")
          sed -n '/^## Summary$/,$p' /tmp/noaa-update.log > /tmp/noaa-summary.md
          printf '\n### Workflow\n\nThis PR was automatically created by the monthly NOAA station update workflow. Run: %s\n' "$WORKFLOW_URL" >> /tmp/noaa-summary.md

      - name: Backfill LAT/HAT
        # The updater above rewrites `datums` wholesale from NOAA's API, which
        # drops any LAT/HAT this repo synthesized last month. Re-run the
        # backfill before quality is evaluated, so the gates see the same datums
        # the package will ship. Idempotent, and self-healing if NOAA starts
        # publishing LAT for a station we had been filling.
        run: npm run refresh:lat-hat -w packages/stations

      - name: Update station files
        # New or moved NOAA records shift proximity and can supersede TICON
        # records, and a new record needs a station and URL, so the station
        # files are rewritten in the same commit or validation fails.
        env:
          STATIONS_RETIRE: ${{ inputs.retire && '1' || '' }}
        run: npm run stations

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data/ stations/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in station data or station files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        id: pr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update NOAA tide station data"
          title: "Update NOAA Stations"
          body-path: /tmp/noaa-summary.md
          branch: update-noaa-stations-${{ github.run_number }}
          # The calibration job marks it ready once the PR carries a report for
          # its constants. A push with GITHUB_TOKEN starts no checks on the PR,
          # so the draft is what keeps it from merging without one.
          draft: true

  calibration:
    # Its own job, so a calibration that can't be refreshed fails here without
    # holding back the station data the import's PR carries.
    needs: noaa
    if: needs.noaa.outputs.branch
    runs-on: ubuntu-latest
    # Six 10-minute waits on Stillwell, plus fitting and NOAA's API.
    timeout-minutes: 120
    env:
      BRANCH: ${{ needs.noaa.outputs.branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout the import's branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.noaa.outputs.branch }}

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Refresh the calibration
        # Fits the calibration gauges again from Stillwell, with NOAA's analysis
        # years read from its API, so the PR carries a report computed from the
        # constants it imports. A gauge that can't be fitted, or a NOAA comment
        # the refresh can't read, fails the job.
        run: npm run refresh:calibration -w packages/harmonic-analysis

      - name: Push the report
        run: |
          if [[ -n $(git status --porcelain docs/calibration/) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/calibration/
            git commit -m "chore: refresh the calibration"
            git push
          fi

      - name: Test the report
        # A push with GITHUB_TOKEN starts no checks on the PR, so the tests
        # that read the report run here, before the PR is marked ready.
        run: npm test -w packages/harmonic-analysis

      - name: Mark the PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "$BRANCH"

      - name: Say why the PR stays a draft
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$BRANCH" --body "The calibration job failed, so this PR stays a draft: $RUN_URL. Fix the cause, run \`npm run refresh:calibration -w packages/harmonic-analysis\` and \`npm test -w packages/harmonic-analysis\` on this branch, and push the report before marking it ready."
