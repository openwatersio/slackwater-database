name: Update Stations

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC
    - cron: "0 2 1 * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  noaa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run NOAA stations update
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tools/update-noaa-stations.ts 2>&1 | tee /tmp/noaa-update.log
          # Extract the markdown summary (everything after "## Summary")
          sed -n '/^## Summary$/,$p' /tmp/noaa-update.log > /tmp/noaa-summary.md
          printf '\n### Workflow\n\n            This PR was automatically created by the monthly NOAA station update workflow.Run: %s\n' "$WORKFLOW_URL" >> /tmp/noaa-summary.md

      - name: Backfill LAT/HAT
        # The updater above rewrites `datums` wholesale from NOAA's API, which
        # drops any LAT/HAT this repo synthesized last month. Re-run the
        # backfill before quality is evaluated, so the gates see the same datums
        # the package will ship. Idempotent, and self-healing if NOAA starts
        # publishing LAT for a station we had been filling.
        run: tools/backfill-lat-hat.ts

      - name: Re-evaluate station quality
        # New/moved NOAA stations shift proximity and can supersede TICON
        # records, so quality.json must be regenerated in the same commit or it
        # goes stale against the data it describes.
        run: tools/evaluate-quality.ts

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data/ quality.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in station data or quality.json"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update NOAA tide station data"
          title: "Update NOAA Stations"
          body-path: /tmp/noaa-summary.md
          branch: update-noaa-stations-${{ github.run_number }}
