name: Update Stations

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC
    - cron: "0 2 1 * *"
  workflow_dispatch: # Allow manual triggering
    inputs:
      retire:
        description: Allow more than ten records to retire in this run, once the import is checked
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  noaa:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Check country pin ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/fetch-country-build-lock.mjs "$RUNNER_TEMP/country-build/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run NOAA stations update
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # An explicit `bash` runs with pipefail, so a crashed import fails the
        # job instead of `tee`'s exit status letting a partial refresh through.
        shell: bash
        run: |
          npm run -s import -w sources/noaa 2>&1 | tee /tmp/noaa-update.log
          # Extract the markdown summary (everything after "## Summary")
          sed -n '/^## Summary$/,$p' /tmp/noaa-update.log > /tmp/noaa-summary.md
          printf '\n### Workflow\n\nThis PR was automatically created by the monthly NOAA station update workflow. Run: %s\n' "$WORKFLOW_URL" >> /tmp/noaa-summary.md

      - name: Backfill LAT/HAT
        # The updater above rewrites `datums` wholesale from NOAA's API, which
        # drops any LAT/HAT this repo synthesized last month. Re-run the
        # backfill before quality is evaluated, so the gates see the same datums
        # the package will ship. Idempotent, and self-healing if NOAA starts
        # publishing LAT for a station we had been filling.
        run: npm run refresh:lat-hat -w packages/stations

      - name: Update station files
        # New or moved NOAA records shift proximity and can supersede TICON
        # records, and a new record needs a station and URL, so the station
        # files are rewritten in the same commit or validation fails.
        env:
          STATIONS_RETIRE: ${{ inputs.retire && '1' || '' }}
        run: npm run stations

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain data/noaa/ stations/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in station data or station files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Prepare review summary
        if: steps.changes.outputs.has_changes == 'true'
        run: cp /tmp/noaa-summary.md noaa-summary.md

      - uses: actions/upload-artifact@v7.0.2
        if: steps.changes.outputs.has_changes == 'true'
        with:
          name: noaa-refresh
          path: |
            data/noaa/
            stations/
            noaa-summary.md
          if-no-files-found: error

  write:
    needs: noaa
    if: needs.noaa.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download refresh data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name noaa-refresh --dir incoming

      - name: Restore refresh data
        run: |
          test -z "$(find incoming -type l -print -quit)"
          rsync -r --delete --exclude=.git incoming/data/noaa/ data/noaa/
          rsync -r --delete --exclude=.git incoming/stations/ stations/
          cp incoming/noaa-summary.md "$RUNNER_TEMP/noaa-summary.md"
          rm -rf incoming

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          add-paths: |
            data/noaa/
            stations/
          commit-message: "chore: update NOAA tide station data"
          title: "Update NOAA Stations"
          body-path: ${{ runner.temp }}/noaa-summary.md
          branch: update-noaa-stations-${{ github.run_number }}
