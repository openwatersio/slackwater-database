name: Update NOAA Currents
# Keeps the committed bundle in step with NOAA and files a review issue when it moves.
#
# Two cadences, because they catch different things:
#   weekly  — cheap pre-flight (ONE request for the station list). Full extraction only
#             if a station was added, removed, or reclassified.
#   monthly — forced full extraction. The pre-flight cannot see NOAA revising the
#             constituents of a station that already exists; only a bundle diff can.
#
# A full extraction is ~2,800 paced requests, ~25 min, verified to complete from a
# GitHub-hosted runner without throttling failures.
on:
  schedule:
    - cron: "17 13 * * 1" # Mondays — pre-flight
    - cron: "17 13 1 * *" # 1st of the month — forced
  workflow_dispatch:
    inputs:
      force:
        description: Run the full extraction even if the station list is unchanged
        type: boolean
        default: true
      retire:
        description: Allow more than ten records to retire in this run, once the bundle is checked
        type: boolean
        default: false
permissions:
  contents: write
  # The workflow pushes a branch and files an issue carrying the review material plus
  # a one-click compare link.
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml

      - name: Pre-flight — has NOAA's station list changed?
        id: preflight
        run: |
          set +e
          npm run -s report:drift -w sources/noaa-current 2> drift.txt
          echo "drifted=$([ $? -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Decide whether to extract
        id: decide
        run: |
          FORCE="${{ github.event.schedule == '17 13 1 * *' || inputs.force }}"
          DRIFTED="${{ steps.preflight.outputs.drifted }}"
          if [ "$FORCE" = "true" ] || [ "$DRIFTED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Station list unchanged and not a forced run — nothing to do."
          fi

      - name: Full extraction
        if: steps.decide.outputs.run == 'true'
        run: |
          npm run -s import -w sources/noaa-current -- --pace 300
          npm run -s refresh:lock -w sources/noaa-current

      # Validate BEFORE pushing anything. A human opens the PR from the compare link in
      # the issue, so CI does run on it eventually — but this gate fires earlier and
      # cheaper: a truncated extraction never becomes a branch, an issue, or a review
      # someone has to reason about. Failing here also keeps the bad bundle off origin.
      - name: Validate the bundle
        if: steps.decide.outputs.run == 'true'
        run: npm run -s validate -w sources/noaa-current

      # A new current station needs a station file and URL, and a moved one a
      # new position in its file, or validation fails on the PR.
      - name: Update station files
        if: steps.decide.outputs.run == 'true'
        env:
          STATIONS_RETIRE: ${{ inputs.retire && '1' || '' }}
        run: |
          npm ci --ignore-scripts
          npm run -s stations

      - name: Push the branch and file a review issue if anything changed
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # An explicit `bash` runs with pipefail, so a failed `gh api` listing
        # fails the step instead of quietly leaving superseded issues open.
        shell: bash
        run: |
          # `generated` timestamps change on every run; ignore them when deciding
          # whether there is a real change to review.
          if git diff --quiet -- sources/noaa-current/currents.json sources/noaa-current/stations.lock.json; then
            echo "No changes."; exit 0
          fi
          CHANGED=$(git diff --numstat -- sources/noaa-current/currents.json | awk '{print $1" added, "$2" removed"}')
          if [ "$(git diff --numstat -- sources/noaa-current/currents.json sources/noaa-current/stations.lock.json | wc -l)" -gt 0 ] && \
             [ -z "$(git diff -U0 -- sources/noaa-current/currents.json sources/noaa-current/stations.lock.json | grep '^[+-]' | grep -v '^[+-][+-]' | grep -v '"generated"')" ]; then
            echo "Only the generated timestamp changed — nothing to review."; exit 0
          fi

          BRANCH="noaa-station-update-$(date +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add sources/noaa-current/currents.json sources/noaa-current/stations.lock.json stations/
          git commit -m "data: refresh NOAA current-station bundle"
          git push -q origin "$BRANCH"

          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"

          {
            echo "NOAA's current-station data has changed. The refreshed bundle is pushed"
            echo "to branch [\`$BRANCH\`](${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH)."
            echo
            echo "**[→ Open the pull request]($COMPARE)**"
            echo
            echo '```'
            npm run -s validate -w sources/noaa-current 2>&1
            echo '```'
            echo
            echo "Bundle diff: $CHANGED lines."
            echo
            if [ -s drift.txt ]; then
              echo "<details><summary>Station-list drift</summary>"
              echo; echo '```'; cat drift.txt; echo '```'; echo "</details>"
            else
              echo "The station *list* is unchanged — this is an in-place revision of"
              echo "existing station data, which only a bundle diff can catch."
            fi
            echo
            echo "Review the diff, merge, then cut a TCDB release."
            echo
            echo "<sub>Filed as an issue rather than opened as a PR because GITHUB_TOKEN"
            echo "is refused \`createPullRequest\` on this org. Close this issue once the"
            echo "branch is merged.</sub>"
          } > body.md

          ISSUE_URL=$(gh issue create --title "Refresh NOAA current-station bundle ($BRANCH)" --label data-refresh --body-file body.md)
          ISSUE_NUMBER=${ISSUE_URL##*/}

          # Each full extraction supersedes the older refreshes.
          OLD_ISSUES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -r --argjson newest "$ISSUE_NUMBER" '
            .[] | select(.pull_request == null and .number < $newest) |
            .number as $number |
            .title | capture("^Refresh NOAA current-station bundle \\((?<branch>noaa-station-update-[0-9]{8})\\)$") |
            [$number, .branch] | @tsv
          ')
          while IFS=$'\t' read -r OLD_NUMBER OLD_BRANCH; do
            [ -n "$OLD_NUMBER" ] || continue
            gh issue close "$OLD_NUMBER" --comment "Superseded by #$ISSUE_NUMBER"
            if [ "$OLD_BRANCH" != "$BRANCH" ]; then
              REMOTE_REF=$(git ls-remote --heads origin "refs/heads/$OLD_BRANCH")
              if [ -n "$REMOTE_REF" ]; then
                git push origin --delete "$OLD_BRANCH"
              fi
            fi
          done <<< "$OLD_ISSUES"

          # Also surface it on the run itself, so a failed notification isn't the
          # only trail back to the branch.
          cat body.md >> "$GITHUB_STEP_SUMMARY"
