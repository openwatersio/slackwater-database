name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Pack npm module
        run: npm pack

      - name: Publish to pkg.pr.new
        run: npx pkg-pr-new publish

      - name: Upload npm build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: "*.tgz"

      # GeoNames data (cities500 + admin1 codes) is downloaded by the geocode
      # test on first run. Cache it so we don't re-fetch ~10MB from
      # download.geonames.org on every run. Bump the -v1 suffix to force a refresh.
      - name: Cache GeoNames data
        uses: actions/cache@v6
        with:
          path: tmp/geonames
          key: geonames-v1

      - name: Run tests
        run: npm run test

  tcd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Build TCD harmonics files
        run: npm run build -w tcd

      - name: Run TCD validation tests
        run: npm run test -w tcd

      - name: Upload TCD artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tcd
          path: packages/tcd/dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run lint
