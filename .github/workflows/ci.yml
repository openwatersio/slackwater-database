name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Pack npm module
        run: npm pack -w packages/database

      - name: Publish to pkg.pr.new
        run: npx pkg-pr-new publish ./packages/database

      - name: Upload npm build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: "*.tgz"

      - name: Run tests
        run: npm run test

      - name: Validate station metadata
        # On a pull request, every path the base branch publishes must still
        # belong to its station, as its path or one of its redirects; a
        # retired station's paths stay reserved but answer 404.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            export PUBLISHED_REF=FETCH_HEAD
          fi
          npm run validate

      - name: Check CHS fit snapshots against their releases
        run: npm run validate:chs-fit -w packages/stations

      - name: Warn when CHS current results are stale
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run report:chs-fit-age -w packages/stations

  tcd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Build TCD harmonics files
        run: npm run build -w packages/tcd

      - name: Run TCD validation tests
        run: npm run test:docker -w packages/tcd

      - name: Upload TCD artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tcd
          path: packages/tcd/dist/

  swift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The Swift tests need only the fixture generator, which imports the
      # builder source; skip the root package's prepare build.
      - name: Install dependencies
        run: npm install --ignore-scripts

      # The generated Swift is committed (SwiftPM consumers can't run flatc),
      # so fail when it drifts from the schema.
      - name: Check generated code matches the schema
        run: |
          npm run generate -w swift
          git diff --exit-code -- packages/swift/Sources

      - name: Run Swift tests
        run: npm run test:swift -w swift
        env:
          SLACKWATER_TCDB: ${{ github.workspace }}/packages/database/src/generated/slackwater.tcdb

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run lint

  # A pull request can slip a package in through package-lock.json, which
  # reviewers rarely read. npm keeps existing resolved URLs when it regenerates,
  # so the diff alone misses a swapped tarball; lockfile-lint catches that.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .mise.toml

      - name: Check the lockfile regenerates from package.json
        run: |
          git ls-files --error-unmatch package-lock.json
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json

      - name: Check every package resolves from the npm registry
        run: npx -y lockfile-lint@5.0.1 --path package-lock.json --allowed-hosts npm --validate-https --validate-integrity --validate-package-names
