name: Build and Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      # The last version segment is the data vintage: the committed version is a
      # floor (1.0.0-beta.0 while in pre mode, X.Y.0 after), and each publish
      # replaces that segment with today's date — 1.0.0-beta.20260925 from a
      # prerelease, 1.0.20261115 from a stable.
      - name: Set version
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/database/package.json').version")
          RELEASE_VERSION="${CURRENT_VERSION%.*}.$(date +%Y%m%d)"
          # A prerelease floor must derive a prerelease — the date replaces the
          # floor's final `.0`, so a floor like 1.0.0-beta (no .0) would derive
          # a stable version and publish it to `latest`. Refuse instead.
          if [[ "$CURRENT_VERSION" == *-* && "$RELEASE_VERSION" != *-* ]]; then
            echo "Refusing to publish: $CURRENT_VERSION derived non-prerelease $RELEASE_VERSION." >&2
            echo "A prerelease floor needs a numeric final segment, e.g. 1.0.0-beta.0." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "ASSET_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          npm version "$RELEASE_VERSION" --no-git-tag-version -w packages/database

      - name: Validate station metadata
        run: npm run validate:database

      - name: Build and check npm package
        run: |
          npm run build
          npm pack --dry-run --ignore-scripts -w packages/database

      - name: Build and test TCD harmonics files
        run: npm run test -w packages/tcd

      # Prereleases go out under the beta dist-tag so `latest` only ever moves
      # on a stable publish.
      - name: Publish to npm
        run: npm publish --ignore-scripts -w packages/database ${{ contains(env.RELEASE_VERSION, '-') && '--tag beta' || '' }}

      # Assets are named by data vintage, not npm version, so the file names
      # hold across prerelease, exact, and dated publishes.
      - name: Rename TCD files for release
        run: |
          mv packages/tcd/dist/harmonics.tcd "packages/tcd/dist/slackwater-${ASSET_DATE}.tcd"

      - name: Rename database file for release
        run: cp packages/database/dist/generated/slackwater.tcdb "packages/database/dist/generated/slackwater-${ASSET_DATE}.tcdb"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.RELEASE_VERSION }}
          generateReleaseNotes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          artifacts: "packages/tcd/dist/*.tcd,packages/database/dist/generated/slackwater-*.tcdb"
