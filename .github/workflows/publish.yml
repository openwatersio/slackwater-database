name: Build and Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - name: Set version
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/database/package.json').version")
          RELEASE_VERSION="${CURRENT_VERSION%.*}.$(date +%Y%m%d)"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          npm version "$RELEASE_VERSION" --no-git-tag-version -w packages/database

      - name: Validate station metadata
        run: npm run validate:database

      - name: Build and check npm package
        run: |
          npm run build
          npm pack --dry-run --ignore-scripts -w packages/database

      - name: Build and test TCD harmonics files
        run: npm run test -w packages/tcd

      - name: Publish to npm
        run: npm publish --ignore-scripts -w packages/database

      - name: Rename TCD files for release
        run: |
          mv packages/tcd/dist/harmonics.tcd "packages/tcd/dist/neaps-${RELEASE_VERSION##*.}.tcd"

      - name: Rename database file for release
        run: cp packages/database/dist/generated/neaps.tcdb "packages/database/dist/generated/neaps-${RELEASE_VERSION##*.}.tcdb"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.RELEASE_VERSION }}
          generateReleaseNotes: true
          artifacts: "packages/tcd/dist/*.tcd,packages/database/dist/generated/neaps-*.tcdb"
