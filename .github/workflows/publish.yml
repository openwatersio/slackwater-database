name: Build and Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (flatc)
        uses: jdx/mise-action@v5.3.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Check country pin ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/fetch-country-build-lock.mjs "$RUNNER_TEMP/country-build/package-lock.json"

      - run: npm ci

      # The last version segment is the data vintage: the committed version is a
      # floor (1.0.1-beta.0 while in pre mode, X.Y.0 after), and each publish
      # replaces that segment with today's date — 1.0.1-beta.20261103 from a
      # prerelease, 1.0.20261115 from a stable.
      - name: Set version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/database/package.json').version")
          RELEASE_VERSION="${CURRENT_VERSION%.*}.$(date -u +%Y%m%d)"
          # A prerelease floor must derive a prerelease — the date replaces the
          # floor's final `.0`, so a floor like 1.0.1-beta (no .0) would derive
          # a stable version and publish it to `latest`. Refuse instead.
          if [[ "$CURRENT_VERSION" == *-* && "$RELEASE_VERSION" != *-* ]]; then
            echo "Refusing to publish: $CURRENT_VERSION derived non-prerelease $RELEASE_VERSION." >&2
            echo "A prerelease floor needs a numeric final segment, e.g. 1.0.1-beta.0." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ASSET_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          npm version "$RELEASE_VERSION" --no-git-tag-version -w packages/database

      - name: Validate station metadata
        # Every path the last release published must still belong to its
        # station, as its path or one of its redirects; a retired station's
        # paths stay reserved but answer 404.
        run: |
          # versionsort.suffix sorts a prerelease below its release. ls-remote
          # runs outside the pipe so its failure stops the step, rather than
          # leaving LAST empty and skipping the published-path check.
          TAGS=$(git -c versionsort.suffix=- ls-remote --tags --sort=-v:refname origin 'v*')
          LAST=$(head -1 <<< "$TAGS" | cut -f2)
          if [ -n "$LAST" ]; then
            git fetch --depth=1 origin "$LAST"
            export PUBLISHED_REF=FETCH_HEAD
          fi
          npm run validate

      - name: Build and check npm package
        run: |
          npm run build
          npm pack --dry-run --ignore-scripts -w packages/database

      - name: Build and test TCD harmonics files
        run: npm run test:docker -w packages/tcd

      - name: Prepare release artifact
        run: |
          mkdir release
          npm pack --ignore-scripts -w packages/database --pack-destination release
          cp packages/tcd/dist/harmonics.tcd "release/slackwater-${ASSET_DATE}.tcd"
          cp packages/database/dist/generated/slackwater.tcdb "release/slackwater-${ASSET_DATE}.tcdb"
          cp packages/database/NOTICE packages/database/LICENSE release/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared-release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Download data only: this job never checks out source or runs package
      # lifecycle scripts while it can request an npm publishing identity.
      - name: Download prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name prepared-release --dir release

      - name: Publish prepared package
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          shopt -s nullglob
          packages=(release/*.tgz)
          test "${#packages[@]}" -eq 1
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            npm publish "${packages[0]}" --ignore-scripts --tag beta
          else
            npm publish "${packages[0]}" --ignore-scripts
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: v${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          artifacts: "release/*.tcd,release/*.tcdb,release/NOTICE,release/LICENSE"
